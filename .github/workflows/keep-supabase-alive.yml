name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 */2 * *'  # Every 2 days at noon UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/valuations?select=id&limit=1")
          echo "Supabase ping status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: unexpected status $STATUS"
            exit 1
          fi

      - name: Assert we are pinging ai-portfolio, not valerius
        run: |
          # A 200 on valuations proves nothing about WHICH project answered — both have
          # that table. valerius_users exists only in the valerius project, so a 404 here
          # is what proves SUPABASE_URL points at ai-portfolio. If this ever returns 200
          # the secret has drifted back to valerius and the keep-alive is guarding the
          # wrong database while looking perfectly green.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/valerius_users?select=id&limit=1")
          if [ "$STATUS" = "404" ]; then
            echo "OK: valerius_users absent (404) - this is ai-portfolio"
          else
            echo "FAIL: valerius_users returned $STATUS - SUPABASE_URL is pointing at valerius"
            exit 1
          fi

      - name: Assert SUPABASE_SERVICE_KEY is a service_role key for this project
        env:
          SVC: ${{ secrets.SUPABASE_SERVICE_KEY }}
          URL: ${{ secrets.SUPABASE_URL }}
        run: |
          # weekly-report.yml is the only job that uses SUPABASE_SERVICE_KEY, and running it
          # costs a real report (Anthropic + JIRA + Pumble). So the key is validated here
          # instead: decode its claims and compare against the project URL. Nothing is
          # written and no key material is printed - only PASS/FAIL and the role name.
          #
          # An UNSET secret arrives as an empty string rather than an error, which is the
          # exact silent failure this guard exists to catch.
          if [ -z "$SVC" ]; then
            echo "FAIL: SUPABASE_SERVICE_KEY is empty or unset"; exit 1
          fi
          URL_REF=$(printf '%s' "$URL" | sed -E 's#https://([^.]+)\..*#\1#')
          case "$SVC" in
            sb_secret_*)
              echo "PASS: new-format secret key present (claims not introspectable)"; exit 0 ;;
            sb_publishable_*)
              echo "FAIL: this is a PUBLISHABLE key - writes will be rejected by RLS"; exit 1 ;;
          esac
          PAYLOAD=$(printf '%s' "$SVC" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in 2) PAYLOAD="$PAYLOAD==" ;; 3) PAYLOAD="$PAYLOAD=" ;; esac
          CLAIMS=$(printf '%s' "$PAYLOAD" | base64 -d 2>/dev/null)
          ROLE=$(printf '%s' "$CLAIMS" | sed -E 's/.*"role"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          KEY_REF=$(printf '%s' "$CLAIMS" | sed -E 's/.*"ref"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          echo "decoded role: $ROLE"
          if [ "$ROLE" != "service_role" ]; then
            echo "FAIL: expected role=service_role, writes would be rejected"; exit 1
          fi
          if [ "$KEY_REF" != "$URL_REF" ]; then
            echo "FAIL: key belongs to a different project than SUPABASE_URL"; exit 1
          fi
          echo "PASS: service_role key, ref matches SUPABASE_URL"
